# Every dependency of every example, including the base image and the
# actions these workflows use. A pull request from Dependabot merges itself
# once the tests pass (auto-merge.yml), and the deploy workflow then puts it
# live and checks it. Security updates come as soon as an advisory is out;
# everything else waits three days, so a release that is pulled for being
# broken or malicious is gone before it gets here.
version: 2
updates:
  - package-ecosystem: npm
    directories: [/misty-heron, /mossy-starling, /sunny-tern]
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Prague }
    cooldown: { default-days: 3 }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: pip
    directories: [/amber-ibis]
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Prague }
    cooldown: { default-days: 3 }
    groups:
      pip: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: [/crimson-finch]
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Prague }
    cooldown: { default-days: 3 }
  - package-ecosystem: github-actions
    directories: [/]
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Prague }
    cooldown: { default-days: 3 }
    groups:
      actions: { patterns: ["*"] }
