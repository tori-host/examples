# Every example's own tests and its build: whether the examples work. A pull
# request merges only when `all tests` passes (branch protection), and the
# deploy workflow runs this same file on main before it deploys. Whether what
# they install has known advisories is audit.yml, which says so loudly but
# holds back neither a merge nor a deploy: an advisory nobody can fix yet
# would otherwise stop every fix that can.
name: Test

on:
  pull_request:
  workflow_call:
    secrets:
      EXAMPLES_FORBIDDEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: node --test test/examples.test.mjs
        env:
          EXAMPLES_FORBIDDEN: ${{ secrets.EXAMPLES_FORBIDDEN }}
          # A pull request from a fork gets no secrets; a maintainer reads
          # it before it can merge. Everything else must have the list.
          EXAMPLES_FORBIDDEN_OPTIONAL: ${{ github.event.pull_request.head.repo.fork && '1' || '0' }}

  node:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [misty-heron, sunny-tern]
    defaults:
      run: { working-directory: "${{ matrix.example }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # No install scripts: nothing here needs one, and a dependency's
      # install script is the usual way a hijacked release runs its code.
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm test
      # What `npx tori.host` publishes for sunny-tern is what this writes.
      - if: matrix.example == 'sunny-tern'
        run: npm run build && test -s dist/index.html

  mossy-starling:
    runs-on: ubuntu-24.04
    env:
      # Tori hands an app its managed database as `sslmode=require` against a
      # certificate no public authority issued: the one shape in which pg 8
      # refuses to connect unless told to read `require` as libpq does. The
      # database here is the same shape, or that would pass untested.
      TEST_DATABASE_URL: postgres://postgres:ci-throwaway@127.0.0.1:5432/postgres?sslmode=require
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Postgres with TLS
        run: |
          docker build -q -t ci-postgres .github/ci/postgres
          docker run -d --name pg -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=ci-throwaway ci-postgres \
            -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          # Over TCP: while the image initialises, its temporary server
          # listens on the socket only, so this answers once the real one is up.
          for _ in $(seq 60); do docker exec pg pg_isready -q -h 127.0.0.1 && exit 0; sleep 1; done
          docker logs pg; exit 1
      - run: npm ci --ignore-scripts --no-fund --no-audit
        working-directory: mossy-starling
      - run: npm test
        working-directory: mossy-starling

  entry-guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: (cd misty-heron && npm ci --ignore-scripts --no-fund --no-audit) && (cd mossy-starling && npm ci --ignore-scripts --no-fund --no-audit)
      - run: .github/scripts/entry-guards.sh

  amber-ibis:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: amber-ibis }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      # Every line has a hash, so pip refuses anything that is not exactly
      # what was compiled, and anything the files do not list.
      - run: python -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider

  # crimson-finch ships in its own image, on the Node of its base image, so
  # its tests run on that Node and the built image has to serve its page.
  crimson-finch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: docker build -q -t crimson-finch:ci crimson-finch
      - name: The tests, on the image's Node
        run: docker run --rm --entrypoint node -v "$PWD/crimson-finch:/src:ro" -w /src crimson-finch:ci --test
      - name: The image serves the page
        run: |
          docker run -d --name app -p 127.0.0.1:8080:8080 crimson-finch:ci
          marker=$(jq -r '.examples[] | select(.name == "crimson-finch") | .check.contains' examples.json)
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8080/ | grep -qF -- "$marker" && exit 0; sleep 1; done
          docker logs app; exit 1

  # The one check branch protection requires, so a job added above is
  # required without anyone editing the protection.
  all:
    name: all tests
    if: always()
    needs: [manifest, node, mossy-starling, entry-guards, amber-ibis, crimson-finch]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")'
        env:
          NEEDS: ${{ toJSON(needs) }}
